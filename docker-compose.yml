      Bootstrap__Username: ${BOOTSTRAP_USERNAME:-admin}
      Bootstrap__Password: ${BOOTSTRAP_PASSWORD:-}
      Bootstrap__Email: ${BOOTSTRAP_EMAIL:-admin@vnc.local}
      Smtp__Host: ${SMTP_HOST:-smtp.gmail.com}
