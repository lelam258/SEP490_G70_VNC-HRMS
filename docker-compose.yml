      InternalApi__Key: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
      ForwardedHeaders__KnownProxies__0: 172.30.70.10
      Services__IAM: http://iam:8080
      Services__HR: http://hr:8080
      Bootstrap__Username: ${BOOTSTRAP_USERNAME:-admin}
      Bootstrap__Password: ${BOOTSTRAP_PASSWORD:-}
      Bootstrap__Email: ${BOOTSTRAP_EMAIL:-admin@vnc.local}
      Smtp__Host: ${SMTP_HOST:-smtp.gmail.com}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL:-}
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
