      Smtp__Host: ${SMTP_HOST:-smtp.gmail.com}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL:-}
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY:-}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      sqlserver:
        condition: service_healthy
  gateway:
    build:
      context: .
      dockerfile: backend/Gateway/VNC.HRMS.Gateway/Dockerfile
    networks:
      default:
        ipv4_address: 172.30.70.10
    ports:
      - "5100:8080"
    environment:
      ReverseProxy__Clusters__IAM__Destinations__primary__Address: http://iam:8080/
      ReverseProxy__Clusters__HR__Destinations__primary__Address: http://hr:8080/
      ReverseProxy__Clusters__Attendance__Destinations__primary__Address: http://attendance:8080/
      ReverseProxy__Clusters__Payroll__Destinations__primary__Address: http://payroll:8080/
      ReverseProxy__Clusters__Compliance__Destinations__primary__Address: http://compliance:8080/
      ReverseProxy__Clusters__Notification__Destinations__primary__Address: http://notification:8080/
    depends_on:
      - iam
      - hr
      - attendance
      - payroll
      - compliance
      - notification
volumes:
  sql-data:

networks:
  default:
    ipam:
      config:
        - subnet: 172.30.70.0/24
