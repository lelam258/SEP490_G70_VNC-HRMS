    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Compliance: "Server=sqlserver;Database=VNC_Compliance_DB;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
      Jwt__Issuer: VncHrms.Auth
      Jwt__Audience: VncHrms.Services
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      InternalApi__Key: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
      ForwardedHeaders__KnownProxies__0: 172.30.70.10
      Services__IAM: http://iam:8080
