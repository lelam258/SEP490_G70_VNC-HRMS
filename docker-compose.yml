    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__Notification: "Server=sqlserver;Database=VNC_Notification_DB;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
      Jwt__Issuer: VncHrms.Auth
