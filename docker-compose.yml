name: vnc-hrms
services:
  sqlserver:
    image: mcr.microsoft.com/mssql/server:2022-latest
    environment:
      ACCEPT_EULA: "Y"
      MSSQL_SA_PASSWORD: ${SQL_SA_PASSWORD:?Set SQL_SA_PASSWORD in .env}
    volumes:
      - sql-data:/var/opt/mssql
    healthcheck:
      test: ["CMD-SHELL", "/opt/mssql-tools18/bin/sqlcmd -S localhost -U sa -P \"$$MSSQL_SA_PASSWORD\" -C -Q 'SELECT 1' -b -o /dev/null"]
      interval: 10s
      timeout: 5s
      retries: 20
      start_period: 20s
  iam:
    build:
      context: .
      dockerfile: backend/Services/IAM/VNC.HRMS.IAM.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__IAM: "Server=sqlserver;Database=VNC_IAM_DB;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
      Jwt__Issuer: VncHrms.Auth
      Jwt__Audience: VncHrms.Services
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      InternalApi__Key: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
      ForwardedHeaders__KnownProxies__0: 172.30.70.10
      Services__IAM: http://iam:8080
      Services__HR: http://hr:8080
      Bootstrap__Username: ${BOOTSTRAP_USERNAME:-admin}
      Bootstrap__Password: ${BOOTSTRAP_PASSWORD:-}
      Bootstrap__Email: ${BOOTSTRAP_EMAIL:-admin@vnc.local}
      Smtp__Host: ${SMTP_HOST:-smtp.gmail.com}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL:-}
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY:-}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      sqlserver:
        condition: service_healthy
  hr:
    build:
      context: .
      dockerfile: backend/Services/HR/VNC.HRMS.HR.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
      ConnectionStrings__HR: "Server=sqlserver;Database=VNC_HR_DB;User Id=sa;Password=${SQL_SA_PASSWORD};Encrypt=True;TrustServerCertificate=True;"
      Jwt__Issuer: VncHrms.Auth
      Jwt__Audience: VncHrms.Services
      Jwt__SigningKey: ${JWT_SIGNING_KEY:?Set JWT_SIGNING_KEY in .env}
      InternalApi__Key: ${INTERNAL_API_KEY:?Set INTERNAL_API_KEY in .env}
      ForwardedHeaders__KnownProxies__0: 172.30.70.10
      Services__IAM: http://iam:8080
      Services__HR: http://hr:8080
      Bootstrap__Username: ${BOOTSTRAP_USERNAME:-admin}
      Bootstrap__Password: ${BOOTSTRAP_PASSWORD:-}
      Bootstrap__Email: ${BOOTSTRAP_EMAIL:-admin@vnc.local}
      Smtp__Host: ${SMTP_HOST:-smtp.gmail.com}
      Smtp__Port: ${SMTP_PORT:-587}
      Smtp__Username: ${SMTP_USERNAME:-}
      Smtp__Password: ${SMTP_PASSWORD:-}
      Smtp__FromEmail: ${SMTP_FROM_EMAIL:-}
      Cloudinary__CloudName: ${CLOUDINARY_CLOUD_NAME:-}
      Cloudinary__ApiKey: ${CLOUDINARY_API_KEY:-}
      Cloudinary__ApiSecret: ${CLOUDINARY_API_SECRET:-}
    depends_on:
      sqlserver:
        condition: service_healthy
  attendance:
    build:
      context: .
      dockerfile: backend/Services/Attendance/VNC.HRMS.Attendance.API/Dockerfile
    environment:
      ASPNETCORE_ENVIRONMENT: Production
